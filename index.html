<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GOD'S EYE｜上帝之眼</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071018;
  color:#e8edf2;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",
  "PingFang TC","Microsoft JhengHei",sans-serif;
}
button,input{
  font:inherit;
}
button{
  border:0;
  cursor:pointer;
}
#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* Header */
header{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#0c151e;
  border-bottom:1px solid #26333e;
}
.title{
  font-size:19px;
  font-weight:700;
  letter-spacing:.5px;
}
.subtitle{
  font-size:11px;
  color:#8d9ba7;
  margin-top:2px;
}
.headerRight{
  display:flex;
  gap:8px;
  align-items:center;
}
.badge{
  padding:6px 9px;
  border-radius:8px;
  background:#14222d;
  color:#aebdca;
  font-size:11px;
}

/* Main */
main{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) 310px;
  gap:10px;
  padding:10px;
}

#worldPanel{
  min-width:0;
  min-height:0;
  position:relative;
  border:1px solid #273640;
  border-radius:12px;
  overflow:hidden;
  background:#08131a;
}
#world{
  width:100%;
  height:100%;
  display:block;
}

.worldOverlay{
  position:absolute;
  left:12px;
  top:12px;
  pointer-events:none;
}
.era{
  font-size:20px;
  font-weight:700;
  text-shadow:0 2px 5px #000;
}
.year{
  margin-top:3px;
  font-size:12px;
  color:#c4d0d8;
  text-shadow:0 2px 4px #000;
}

#side{
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:9px;
  overflow:auto;
}

.card{
  background:#0d1821;
  border:1px solid #273640;
  border-radius:11px;
  padding:11px;
}
.card h2{
  margin:0 0 9px;
  font-size:14px;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.stat{
  background:#101f29;
  border-radius:8px;
  padding:8px;
}
.statLabel{
  color:#83939f;
  font-size:10px;
}
.statValue{
  margin-top:3px;
  font-size:16px;
  font-weight:700;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.controls button,
.worldButtons button{
  min-height:38px;
  border-radius:8px;
  color:#e9f0f5;
  background:#1a2a35;
  border:1px solid #30424f;
}
.controls button.primary{
  background:#315c73;
}
.controls button.danger{
  background:#442c32;
}
.worldButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}

.prayer{
  min-height:100px;
}
.prayerText{
  font-size:12px;
  line-height:1.55;
  color:#cbd5dc;
}
.prayerActions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}
.prayerActions button{
  min-height:34px;
  border-radius:7px;
  color:#fff;
  background:#1c2b35;
}
.prayerActions .yes{background:#285744}
.prayerActions .no{background:#553238}

.eventLog{
  height:130px;
  overflow:auto;
  font-size:10px;
  line-height:1.5;
  color:#9eacb6;
}
.eventItem{
  padding:4px 0;
  border-bottom:1px solid #1b2932;
}
.eventItem strong{
  color:#d7e0e6;
}

.seedRow{
  display:flex;
  gap:6px;
}
.seedRow input{
  flex:1;
  min-width:0;
  background:#08131a;
  border:1px solid #30404c;
  border-radius:7px;
  padding:7px;
  color:#e8edf2;
}
.seedRow button{
  width:72px;
  border-radius:7px;
  background:#243844;
  color:#fff;
}

/* Mobile */
@media(max-width:800px){
  body{
    overflow:auto;
  }
  #app{
    min-height:100%;
    height:auto;
  }
  header{
    height:54px;
  }
  main{
    display:flex;
    flex-direction:column;
    padding:7px;
  }
  #worldPanel{
    height:58vh;
    min-height:340px;
  }
  #side{
    overflow:visible;
  }
}
</style>
</head>

<body>
<div id="app">

<header>
  <div>
    <div class="title">GOD'S EYE</div>
    <div class="subtitle">上帝之眼｜文明觀察模擬</div>
  </div>

  <div class="headerRight">
    <div class="badge" id="statusBadge">運行中</div>
    <div class="badge" id="speedBadge">1 秒＝10 年</div>
  </div>
</header>

<main>

  <section id="worldPanel">
    <canvas id="world"></canvas>

    <div class="worldOverlay">
      <div class="era" id="eraText">石器時代</div>
      <div class="year" id="yearText">西元前 10000 年</div>
    </div>
  </section>

  <aside id="side">

    <section class="card">
      <h2>世界狀態</h2>

      <div class="stats">
        <div class="stat">
          <div class="statLabel">人口</div>
          <div class="statValue" id="population">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">聚落</div>
          <div class="statValue" id="settlements">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">城市</div>
          <div class="statValue" id="cities">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">文明</div>
          <div class="statValue" id="civilizations">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">科技</div>
          <div class="statValue" id="technology">0</div>
        </div>

        <div class="stat">
          <div class="statLabel">資源</div>
          <div class="statValue" id="resources">0</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>上帝操作</h2>

      <div class="controls">
        <button id="pauseBtn" class="primary">暫停</button>
        <button id="resetBtn">重置</button>

      <div class="worldButtons">
        <button id="newWorldBtn">新世界</button>

    <section class="card">
      <h2>世界 Seed</h2>

      <div class="seedRow">
        <input id="seedInput" maxlength="18">
        <button id="seedBtn">套用</button>

    </section>

    <section class="card prayer">
      <h2>祈禱</h2>

      <div class="prayerText" id="prayerText">
        暫時沒有祈禱。
      </div>

      <div class="prayerActions">
        <button class="yes" id="prayerYes">同意</button>
        <button class="no" id="prayerNo">拒絕</button>
        <button id="prayerIgnore">忽略</button>
      </div>
    </section>

    <section class="card">
      <h2>世界事件</h2>
      <div class="eventLog" id="eventLog"></div>
    </section>

  </aside>
</main>

</div>

<script>
"use strict";

/* =========================================================
   GOD'S EYE
   Single-file civilization simulation
   No backend / no API / no database
   Seeded Random / Canvas / localStorage
   ========================================================= */

const CONFIG = {
  MAP_SIZE:64,
  MAX_CIVILIZATIONS:30,
  MAX_CITIES:150,
  MAX_EVENTS:200,
  YEARS_PER_SECOND:10,
  TICK_MS:1000,
  STORAGE_KEY:"gods_eye_world_v1"
};

/* ---------- Seeded Random ---------- */

function hashSeed(str){
  let h=2166136261>>>0;

  for(let i=0;i<str.length;i++){
    h^=str.charCodeAt(i);
    h=Math.imul(h,16777619);
  }

  return h>>>0;
}

function makeRNG(seed){
  let state=hashSeed(String(seed));

  return {
    next(){
      state+=0x6D2B79F5;
      let t=state;
      t=Math.imul(t^t>>>15,t|1);
      t^=t+Math.imul(t^t>>>7,t|61);
      return ((t^t>>>14)>>>0)/4294967296;
    },

    int(min,max){
      return Math.floor(this.next()*(max-min+1))+min;
    },

    pick(arr){
      return arr[Math.floor(this.next()*arr.length)];
    }
  };
}

/* ---------- World ---------- */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

let rng;
let world=null;
let timer=null;

const state={
  running:true,
  year:-10000,
  seed:"",
  prayer:null,
  eventTimer:0
};

function createSeed(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result="";

  for(let i=0;i<8;i++){
    result+=chars[Math.floor(Math.random()*chars.length)];
  }

  return result;
}

function createWorld(seed){
  rng=makeRNG(seed);

  const terrain=[];

  for(let y=0;y<CONFIG.MAP_SIZE;y++){
    const row=[];

    for(let x=0;x<CONFIG.MAP_SIZE;x++){
      const edge=Math.min(x,y,CONFIG.MAP_SIZE-1-x,CONFIG.MAP_SIZE-1-y);
      let value=rng.next();

      if(edge<2){
        value*=.65;
      }

      if(value<.14) row.push(0);
      else if(value<.24) row.push(1);
      else if(value<.86) row.push(2);
      else row.push(3);
    }

    terrain.push(row);
  }

  const settlements=[];
  const cities=[];
  const civilizations=[];

  for(let i=0;i<18;i++){
    let x=rng.int(4,CONFIG.MAP_SIZE-5);
    let y=rng.int(4,CONFIG.MAP_SIZE-5);

    if(terrain[y][x]===0){
      i--;
      continue;
    }

    settlements.push({
      x,
      y,
      population:rng.int(20,90),
      age:rng.int(0,500)
    });
  }

  for(let i=0;i<4;i++){
    civilizations.push({
      id:i+1,
      name:randomCivilizationName(),
      population:rng.int(300,900),
      technology:rng.int(2,8),
      stability:rng.int(55,85),
      power:rng.int(30,70),
      color:i
    });
  }

  return {
    terrain,
    settlements,
    cities,
    civilizations,
    resources:rng.int(70,100),
    events:[]
  };
}

/* ---------- Names ---------- */

const prefixes=[
  "阿","洛","塔","伊","卡","米","蘇","納","亞","瓦","希","拉"
];

const suffixes=[
  "拉","恩","亞","特","斯","克","姆","利","安","多","爾","卡"
];

function randomCivilizationName(){
  return rng.pick(prefixes)+rng.pick(suffixes)+rng.pick(suffixes);
}

/* ---------- Simulation ---------- */

function eraName(){
  if(state.year< -3000) return "石器時代";
  if(state.year< 500) return "古代";
  return "現代";
}

function updateSimulation(){

  if(!world || !state.running) return;

  state.year+=CONFIG.YEARS_PER_SECOND;

  /* Resource regeneration / consumption */
  world.resources += rng.int(-2,3);
  world.resources=Math.max(0,Math.min(100,world.resources));

  /* Settlements */
  world.settlements.forEach(s=>{
    const growth=1+rng.next()*3;
    s.population+=growth;

    if(s.population>220 && world.cities.length<CONFIG.MAX_CITIES){
      if(rng.next()<0.02){
        world.cities.push({
          x:s.x,
          y:s.y,
          population:Math.floor(s.population),
          civilization:rng.int(1,Math.max(1,world.civilizations.length))
        });

        addEvent(
          "城市建立",
          "一個聚落發展成城市。"
        );
      }
    }
  });

  /* Civilization development */
  world.civilizations.forEach(c=>{

    if(rng.next()<0.65){
      c.population+=rng.int(1,12);
    }

    if(rng.next()<0.18){
      c.technology+=rng.int(1,2);

      if(c.technology>100){
        c.technology=100;
      }

      addEvent(
        "科技發展",
        `${c.name} 的科技水準提升。`
      );
    }

    c.stability+=rng.int(-3,3);
    c.stability=Math.max(0,Math.min(100,c.stability));

    c.power+=rng.int(-2,3);
    c.power=Math.max(0,Math.min(100,c.power));
  });

  /* Random events */
  if(rng.next()<0.16){
    randomWorldEvent();
  }

  /* Prayer */
  if(!state.prayer && rng.next()<0.07){
    createPrayer();
  }

  render();
  updateUI();
}

/* ---------- Events ---------- */

function randomWorldEvent(){

  const events=[
    ()=>{
      world.resources=Math.max(0,world.resources-rng.int(5,15));
      addEvent("乾旱","部分地區遭遇長期乾旱，資源下降。");
    },

    ()=>{
      world.resources=Math.min(100,world.resources+rng.int(5,12));
      addEvent("豐收","氣候良好，糧食與資源增加。");
    },

    ()=>{
      if(world.civilizations.length>1){
        const a=rng.pick(world.civilizations);
        const b=rng.pick(world.civilizations);

        if(a!==b){
          a.stability=Math.max(0,a.stability-8);
          b.stability=Math.max(0,b.stability-8);

          addEvent(
            "文明衝突",
            `${a.name} 與 ${b.name} 發生衝突。`
          );
        }
      }
    },

    ()=>{
      if(world.settlements.length<80){
        const x=rng.int(3,CONFIG.MAP_SIZE-4);
        const y=rng.int(3,CONFIG.MAP_SIZE-4);

        if(world.terrain[y][x]!==0){
          world.settlements.push({
            x,
            y,
            population:rng.int(20,60),
            age:0
          });

          addEvent(
            "新聚落",
            "人類在新的土地建立聚落。"
          );
        }
      }
    },

    ()=>{
      const c=rng.pick(world.civilizations);

      c.population=Math.max(
        20,
        Math.floor(c.population*(0.85+rng.next()*0.15))
      );

      addEvent(
        "疾病",
        `${c.name} 的人口受到疾病影響。`
      );
    }
  ];

  rng.pick(events)();
}

/* ---------- Prayer ---------- */

function createPrayer(){

  const subjects=[
    "我們的土地正在乾旱。",
    "我們希望找到新的家園。",
    "我們希望部落能夠度過寒冬。",
    "我們希望能找到新的食物來源。",
    "我們的敵人正在逼近。",
    "我們祈求一場豐收。",
    "我們希望天空給我們答案。",
    "我們想知道神是否存在。"
  ];

  state.prayer={
    text:rng.pick(subjects),
    age:0
  };

  updateUI();
}

function answerPrayer(type){

  if(!state.prayer) return;

  const text=state.prayer.text;

  if(type==="yes"){

    const miracle=rng.int(1,4);

    if(miracle===1){
      world.resources=Math.min(100,world.resources+20);
      addEvent(
        "神蹟",
        `你回應了祈禱：「${text}」資源突然增加。`
      );
    }

    if(miracle===2){
      world.settlements.forEach(s=>{
        s.population+=rng.int(5,25);
      });

      addEvent(
        "神蹟",
        `你回應了祈禱：「${text}」人口獲得祝福。`
      );
    }

    if(miracle===3){
      world.civilizations.forEach(c=>{
        c.stability=Math.min(100,c.stability+10);
      });

      addEvent(
        "神蹟",
        `你回應了祈禱：「${text}」文明暫時恢復穩定。`
      );
    }

    if(miracle===4){
      addEvent(
        "神蹟",
        `你回應了祈禱：「${text}」但人類無法理解發生了什麼。`
      );
    }

  }else if(type==="no"){

    addEvent(
      "沉默",
      `你拒絕了祈禱：「${text}」`
    );

  }else{

    addEvent(
      "忽略",
      `你沒有回應：「${text}」`
    );
  }

  state.prayer=null;
  updateUI();
}

/* ---------- Logging ---------- */

function addEvent(title,text){

  if(!world) return;

  world.events.unshift({
    year:state.year,
    title,
    text
  });

  if(world.events.length>CONFIG.MAX_EVENTS){
    world.events.length=CONFIG.MAX_EVENTS;
  }

  updateEventLog();
}

function updateEventLog(){

  const el=document.getElementById("eventLog");

  if(!world || world.events.length===0){
    el.innerHTML='<div class="eventItem">世界尚未發生重大事件。</div>';
    return;
  }

  el.innerHTML=world.events
    .slice(0,40)
    .map(e=>`
      <div class="eventItem">
        <strong>${escapeHTML(formatYear(e.year))}｜${escapeHTML(e.title)}</strong><br>
        ${escapeHTML(e.text)}
      </div>
    `)
    .join("");
}

/* ---------- Rendering ---------- */

function resizeCanvas(){

  const rect=canvas.getBoundingClientRect();

  const dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.floor(rect.width*dpr);
  canvas.height=Math.floor(rect.height*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);

  render();
}

function render(){

  if(!world) return;

  const rect=canvas.getBoundingClientRect();
  const width=rect.width;
  const height=rect.height;

  ctx.clearRect(0,0,width,height);

  const cell=Math.min(
    width/CONFIG.MAP_SIZE,
    height/CONFIG.MAP_SIZE
  );

  const mapW=cell*CONFIG.MAP_SIZE;
  const mapH=cell*CONFIG.MAP_SIZE;

  const ox=(width-mapW)/2;
  const oy=(height-mapH)/2;

  /* Terrain */

  for(let y=0;y<CONFIG.MAP_SIZE;y++){

    for(let x=0;x<CONFIG.MAP_SIZE;x++){

      const t=world.terrain[y][x];

      if(t===0){
        ctx.fillStyle="#142b3a";
      }else if(t===1){
        ctx.fillStyle="#274936";
      }else if(t===2){
        ctx.fillStyle="#3f6240";
      }else{
        ctx.fillStyle="#777354";
      }

      ctx.fillRect(
        ox+x*cell,
        oy+y*cell,
        Math.ceil(cell)+.5,
        Math.ceil(cell)+.5
      );
    }
  }

  /* Settlements */

  world.settlements.forEach(s=>{

    const px=ox+s.x*cell+cell/2;
    const py=oy+s.y*cell+cell/2;

    ctx.beginPath();
    ctx.fillStyle="#d7c38a";
    ctx.arc(
      px,
      py,
      Math.max(2,Math.min(5,cell*.28)),
      0,
      Math.PI*2
    );
    ctx.fill();
  });

  /* Cities */

  world.cities.forEach(c=>{

    const px=ox+c.x*cell+cell/2;
    const py=oy+c.y*cell+cell/2;

    ctx.fillStyle="#f1e6bc";

    ctx.fillRect(
      px-cell*.38,
      py-cell*.38,
      cell*.76,
      cell*.76
    );
  });

  /* Civilization centers */

  world.civilizations.forEach((c,i)=>{

    const x=Math.floor(
      ((i+1)/(world.civilizations.length+1))*
      CONFIG.MAP_SIZE
    );

    const y=12+(i*11)%40;

    const px=ox+x*cell+cell/2;
    const py=oy+y*cell+cell/2;

    ctx.beginPath();
    ctx.strokeStyle="rgba(255,220,130,.55)";
    ctx.lineWidth=1;
    ctx.arc(px,py,cell*1.7,0,Math.PI*2);
    ctx.stroke();
  });
}

/* ---------- UI ---------- */

function formatYear(year){

  if(year<0){
    return `西元前 ${Math.abs(year)} 年`;
  }

  return `西元 ${year} 年`;
}

function updateUI(){

  if(!world) return;

  document.getElementById("eraText").textContent=eraName();
  document.getElementById("yearText").textContent=formatYear(state.year);

  const population=Math.floor(
    world.settlements.reduce(
      (sum,s)=>sum+s.population,0
    )+
    world.civilizations.reduce(
      (sum,c)=>sum+c.population,0
    )
  );

  document.getElementById("population")
    .textContent=population.toLocaleString();

  document.getElementById("settlements")
    .textContent=world.settlements.length;

  document.getElementById("cities")
    .textContent=world.cities.length;

  document.getElementById("civilizations")
    .textContent=world.civilizations.length;

  const tech=world.civilizations.length
    ? Math.floor(
        world.civilizations.reduce(
          (s,c)=>s+c.technology,0
        )/world.civilizations.length
      )
    : 0;

  document.getElementById("technology")
    .textContent=tech;

  document.getElementById("resources")
    .textContent=world.resources;

  document.getElementById("statusBadge")
    .textContent=state.running?"運行中":"已暫停";

  document.getElementById("pauseBtn")
    .textContent=state.running?"暫停":"繼續";

  document.getElementById("seedInput")
    .value=state.seed;

  const prayerText=document.getElementById("prayerText");

  if(state.prayer){
    prayerText.textContent=
      `有人正在向你祈禱：\n「${state.prayer.text}」`;
  }else{
    prayerText.textContent="暫時沒有祈禱。";
  }

  updateEventLog();
}

/* ---------- Save / Load ---------- */

function saveWorld(){

  const data={
    state:{
      running:false,
      year:state.year,
      seed:state.seed
    },
    world
  };

  localStorage.setItem(
    CONFIG.STORAGE_KEY,
    JSON.stringify(data)
  );

  addEvent("儲存","世界已儲存到本機。");
}

function loadWorld(){

  try{

    const raw=localStorage.getItem(
      CONFIG.STORAGE_KEY
    );

    if(!raw) return false;

    const data=JSON.parse(raw);

    if(!data.world || !data.state) return false;

    state.year=data.state.year;
    state.seed=data.state.seed;
    state.running=false;

    world=data.world;
    rng=makeRNG(state.seed);

    return true;

  }catch(e){

    return false;
  }
}

/* ---------- New World ---------- */

function startNewWorld(seed){

  state.seed=seed||createSeed();
  state.year=-10000;
  state.running=true;
  state.prayer=null;

  world=createWorld(state.seed);

  world.events=[];

  addEvent(
    "世界誕生",
    `Seed ${state.seed} 的新世界開始運轉。`
  );

  updateUI();
  render();
}

/* ---------- Security ---------- */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ---------- Controls ---------- */

document.getElementById("pauseBtn")
.addEventListener("click",()=>{

  state.running=!state.running;

  updateUI();
});

document.getElementById("resetBtn")
.addEventListener("click",()=>{

  state.year=-10000;
  state.running=true;
  state.prayer=null;

  world=createWorld(state.seed);

  addEvent(
    "世界重置",
    "世界回到初始狀態，Seed 保持不變。"
  );

  updateUI();
  render();
});

document.getElementById("newWorldBtn")
.addEventListener("click",()=>{

  startNewWorld(createSeed());
});

document.getElementById("saveBtn")
.addEventListener("click",()=>{

  saveWorld();
});

document.getElementById("seedBtn")
.addEventListener("click",()=>{

  const value=
    document.getElementById("seedInput")
    .value
    .trim()
    .toUpperCase();

  if(!value) return;

  startNewWorld(value);
});

document.getElementById("prayerYes")
.addEventListener(
  "click",
  ()=>answerPrayer("yes")
);

document.getElementById("prayerNo")
.addEventListener(
  "click",
  ()=>answerPrayer("no")
);

document.getElementById("prayerIgnore")
.addEventListener(
  "click",
  ()=>answerPrayer("ignore")
);

window.addEventListener(
  "resize",
  resizeCanvas
);

/* ---------- Start ---------- */

if(!loadWorld()){

  startNewWorld(createSeed());

}else{

  updateUI();
  render();
}

resizeCanvas();

timer=setInterval(
  updateSimulation,
  CONFIG.TICK_MS
);

</script>

</body>
